<!doctype html>
<html>
<head>
  <style>
    body { padding: 20px 28px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Focus history</h1>
  <p class="td-muted">q or Esc closes this page</p>
  <table><thead><tr><th>When</th><th>Minutes</th></tr></thead><tbody id="rows"></tbody></table>
  <script type="module">
    import { state } from "./timer.js";
    const td = window.thumbdeck;
    const s = await state();
    document.getElementById("rows").innerHTML = s.history.length
      ? [...s.history].reverse().map((h) => `<tr><td>${td.escape(new Date(h.at).toLocaleString())}</td><td>${h.minutes}</td></tr>`).join("")
      : `<tr><td colspan="2" class="td-empty">No sessions yet.</td></tr>`;
    td.on("key", ({ action }) => scrollBy({ top: action === "down" ? 60 : -60 }));
  </script>
</body>
</html>
