<!doctype html>
<html>
<head>
  <style>
    body { display: flex; flex-direction: column; }
    .where { color: var(--yellow); }
    #list { flex: 1; overflow: auto; }
  </style>
</head>
<body>
  <div class="td-toolbar"><strong>TODOs</strong> <span id="count" class="td-muted"></span></div>
  <ul id="list" class="td-list"></ul>
  <script type="module">
    const td = window.thumbdeck;
    let items = [];
    let cursor = 0;

    async function load() {
      const { words } = await td.setup.get();
      const pattern = words.filter(Boolean).join("|") || "TODO";
      // git grep: fast, and skips what .gitignore leaves out; exit 1 means nothing found
      const r = await td.exec(["git", "grep", "-n", "-E", "-I", `\\b(${pattern})\\b`]);
      if (r.code > 1) return show(`<li class="td-error">${td.escape(r.stderr || "git grep failed")}</li>`);
      items = r.stdout.split("\n").filter(Boolean).map((line) => {
        const [file, n, ...text] = line.split(":");
        return { file, line: Number(n), text: text.join(":").trim() };
      });
      cursor = Math.min(cursor, Math.max(0, items.length - 1));
      td.ui.badge(items.length || null);
      render();
    }

    function show(html) {
      document.getElementById("list").innerHTML = html;
    }

    function render() {
      document.getElementById("count").textContent = `${items.length} found`;
      if (!items.length) return show(`<li class="td-empty">Nothing to do.</li>`);
      show(items.map((t, i) => `<li aria-selected="${i === cursor}" data-i="${i}">
        <span class="where">${td.escape(t.file)}:${t.line}</span> ${td.escape(t.text)}</li>`).join(""));
      document.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
    }

    function move(to) {
      cursor = Math.max(0, Math.min(items.length - 1, to));
      render();
    }

    async function open() {
      const t = items[cursor];
      if (t) td.ui.say(await td.tmux(`nvim +${t.line} ${JSON.stringify(t.file)}`, { window: "todo" }));
    }

    td.on("key", ({ action }) => {
      if (action === "down") move(cursor + 1);
      else if (action === "up") move(cursor - 1);
      else if (action === "first") move(0);
      else if (action === "last") move(items.length - 1);
      else if (action === "open") open();
      else if (action === "refresh") load().then(() => td.ui.say("looked again"));
    });
    td.on("setup", load);
    document.getElementById("list").addEventListener("click", (e) => {
      const li = e.target.closest("[data-i]");
      if (li) move(Number(li.dataset.i));
    });
    load();
  </script>
</body>
</html>
