recommended = true

[[plugin]]
id = "go"
name = "Go"
description = "go run, go test"
source = "https://github.com/Nozeren/thumbdeck-plugins#plugins/toolkits/go"
recommended = true

[[plugin]]
id = "gradle"
name = "Gradle"
description = "gradlew build, install, test"
