recommended = true

[[plugin]]
id = "make"
name = "make"
description = "Makefile targets"
source = "https://github.com/Nozeren/thumbdeck-plugins#plugins/toolkits/make"
recommended = true

[[plugin]]
id = "cargo"
name = "Cargo"
description = "cargo run, build, test"
