# The official plugins: thumbdeck's first start offers them (the recommended ones ticked), and
# Settings › Plugins › Add a plugin lists them. `source` is what installs one.

[[plugin]]
id = "git"
name = "Git"
description = "The repo at a glance: changes and their diffs, the branch, commits, branches and stashes (read-only)"
source = "https://github.com/Nozeren/thumbdeck-plugins#plugins/tabs/git"
recommended = true

[[plugin]]
id = "logs"
name = "Logs"
description = "The project's log files: levels, search, errors, live tail, optional sections"
source = "https://github.com/Nozeren/thumbdeck-plugins#plugins/tabs/logs"
recommended = true

[[plugin]]
id = "agents"
name = "Agents"
description = "Claude Code sessions in this project, their subagents, and the subagents and skills it defines"
source = "https://github.com/Nozeren/thumbdeck-plugins#plugins/tabs/agents"
recommended = true

[[plugin]]
id = "prs"
name = "Pull requests"
description = "The repo's open PRs that concern you: to review again, to review, reviewed, yours"
source = "https://github.com/Nozeren/thumbdeck-plugins#plugins/tabs/prs"
recommended = true

