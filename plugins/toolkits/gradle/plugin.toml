# Gradle projects (mostly Android): build, install and test through the project's wrapper
id = "gradle"
name = "Gradle"
version = "1.0.0"
api = 1
description = "gradlew build, install, test"

[detect]
files = ["gradlew", "build.gradle", "build.gradle.kts"]
icon = "android"
priority = 20

# The buttons use ./gradlew, so they need the wrapper
[[action]]
name = "assembleDebug"
command = "./gradlew assembleDebug"
description = "Build the debug APK"
when = { files = ["gradlew"] }

[[action]]
name = "installDebug"
command = "./gradlew installDebug"
description = "Build and install the debug APK on the connected device"
when = { files = ["gradlew"] }

[[action]]
name = "test"
command = "./gradlew test"
description = "Run the unit tests"
when = { files = ["gradlew"] }
