# Rust projects
id = "cargo"
name = "Cargo"
version = "1.0.0"
api = 1
description = "cargo run, build, test"

[detect]
files = ["Cargo.toml"]
icon = "rust"
priority = 45

[[action]]
name = "run"
command = "cargo run"

[[action]]
name = "build"
command = "cargo build"

[[action]]
name = "test"
command = "cargo test"
