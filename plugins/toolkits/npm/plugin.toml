# JavaScript projects: one button per script in package.json, run with the project's
# package manager (npm, pnpm, yarn or bun, from the lockfile)
id = "npm"
name = "npm"
version = "1.0.0"
api = 1
description = "package.json scripts"

[detect]
files = ["package.json"]
icon = "node"
priority = 40

[[generate]]
source = { json = "package.json", keys = "scripts" }
# Lifecycle hooks aren't things you run by hand
skip = ["prepare", "postinstall", "preinstall", "install", "prepublishOnly"]
action = { name = "{item}", command = "{pm} run {item}" }
