# Docker Compose: start, stop and watch the project's services
id = "compose"
name = "Compose"
version = "1.0.0"
api = 1
description = "docker compose up, down, logs, ps"

[detect]
files = ["compose.yaml", "compose.yml", "docker-compose.yml", "docker-compose.yaml"]
priority = 70

[[action]]
name = "up"
command = "docker compose up -d"
description = "Start the services in the background"

[[action]]
name = "down"
command = "docker compose down"
description = "Stop and remove the services"

[[action]]
name = "logs"
command = "docker compose logs -f --tail=100"
description = "Follow the services' logs"

[[action]]
name = "ps"
command = "docker compose ps"
description = "List the services"
