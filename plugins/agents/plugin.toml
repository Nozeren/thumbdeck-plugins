id = "agents"
name = "Agents"
version = "1.0.0"
api = 1
description = "Claude Code sessions in this project, their subagents, and the subagents and skills it defines"
homepage = "https://github.com/Nozeren/thumbdeck-plugins/tree/main/plugins/agents"

[backend]
command = "node backend.js"
# It tells the avatar when a Claude Code session is working or waiting for you, in any project
autostart = true

[[tab]]
id = "agents"
name = "Agents"
page = "dist/tab.html"

[[tab.setup]]
key = "user_agents"
label = "Also list your own subagents and skills, for all projects (~/.claude)"
type = "bool"
default = true

[keys.list]
name = "AGENTS"
surface = "tab:agents"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "down" },
  { keys = ["k", "ArrowUp"], action = "up", does = "up" },
  { keys = ["g"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["l", "Enter"], action = "open", does = "open: an agent or skill to start, a session's conversation" },
  { keys = ["Tab"], action = "next-list", does = "next list: agents → skills → sessions" },
  { keys = ["Shift+Tab"], action = "previous-list", does = "previous list" },
  { keys = ["r"], action = "refresh", does = "look again" },
]

[keys.conversation]
name = "CONVERSATION"
surface = "tab:agents"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "down" },
  { keys = ["k", "ArrowUp"], action = "up", does = "up" },
  { keys = ["g"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["d", "PageDown"], action = "page-down", does = "a page down" },
  { keys = ["u", "PageUp"], action = "page-up", does = "a page up" },
  { keys = ["l", "Enter", "Space"], action = "open", does = "a tool call: its details; ◇ Agent: its conversation" },
  { keys = ["h", "Backspace", "-"], action = "back", does = "back" },
  { keys = ["r"], action = "refresh", does = "read it again" },
]

[keys.start]
name = "START"
surface = "tab:agents"
bindings = [
  { keys = ["i", "Enter"], action = "type", does = "type the task (Enter in the box starts Claude in tmux)" },
  { keys = ["h", "Backspace", "-"], action = "back", does = "back" },
]
