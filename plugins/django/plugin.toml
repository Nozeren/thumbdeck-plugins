# Django projects: the everyday manage.py commands
id = "django"
name = "Django"
version = "1.0.0"
api = 1
description = "manage.py commands"

[detect]
files = ["manage.py"]
icon = "django"
priority = 10
requires = ["python"]           # pip install, venv, ... come along

[vars]
manage = "{python} manage.py"

[[action]]
name = "runserver"
command = "{manage} runserver"
description = "Start the development server (in the tmux window 'server')"
tmux = { window = "server" }

[[action]]
name = "migrate"
command = "{manage} migrate"
description = "Apply database migrations"

[[action]]
name = "makemigrations"
command = "{manage} makemigrations"
description = "Create migrations from model changes"

[[action]]
name = "test"
command = "{manage} test"
description = "Run the test suite"

[[action]]
name = "shell"
command = "{manage} shell"
description = "Django shell (interactive, in the tmux window 'shell')"
tmux = { window = "shell" }
