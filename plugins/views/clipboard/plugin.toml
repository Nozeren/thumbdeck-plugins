id = "clipboard"
name = "Clipboard"
version = "2.0.0"
api = 2
description = "What you copied: the last 100 texts, searchable, copied again with one key; pin the ones you reuse"
homepage = "https://github.com/Nozeren/thumbdeck-plugins/tree/main/plugins/views/clipboard"
icon = "icon.svg"

[view]
name = "Clipboard"
page = "view.html"
status = true

[backend]
command = "node backend.js"
# It notices copies while thumbdeck runs, not only while its view is open
autostart = true

[[settings]]
key = "keep"
label = "Keep this many (pinned ones don't count)"
type = "number"
min = 10
max = 1000
default = 100

[[settings]]
key = "remember"
label = "Remember them when thumbdeck closes"
type = "bool"
default = true
help = "Kept in the plugin's data folder, readable only by you. Password managers' copies are never kept."

[keys.view]
name = "CLIPBOARD"
surface = "view"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "next" },
  { keys = ["k", "ArrowUp"], action = "up", does = "previous" },
  { keys = ["gg"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["Enter"], action = "copy", does = "copy it again (it goes back to the top)" },
  { keys = ["yy", "Y"], action = "yank", does = "the same" },
  { keys = ["/"], action = "search", does = "search" },
  { keys = ["Space p"], action = "pin", does = "pin or unpin it (pinned ones stay at the top and are never dropped)" },
  { keys = ["dd"], action = "delete", does = "remove it from the list" },
  { keys = ["Space s"], action = "stop", does = "pause or resume keeping copies (:clear clears the list but the pinned ones)" },
]
