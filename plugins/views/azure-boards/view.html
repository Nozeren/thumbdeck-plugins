<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="view.css">
</head>
<body>
  <header class="td-toolbar"><strong>Azure Boards</strong> <span class="td-muted" id="summary"></span>
    <span class="spacer"></span><span class="td-muted" id="updated"></span>
    <button id="sprint" title="Only the current sprint's (i)">Sprint</button>
    <button id="refresh" title="Look again (r)">↻</button></header>
  <p class="td-error" id="error" hidden></p>
  <p class="td-muted" id="warning" hidden></p>
  <input id="filter" placeholder="Filter by title… (Enter keeps it, Esc clears)" hidden>
  <div id="ask" hidden>
    <label id="ask-label" for="ask-input"></label>
    <input id="ask-input" autocomplete="off" spellcheck="false">
    <ul id="ask-choices"></ul>
    <div class="buttons"><p class="td-muted" id="ask-hint"></p><button id="ask-cancel">Cancel</button><button id="ask-ok">Save</button></div>
  </div>
  <main>
    <ul id="list"></ul>
    <section id="detail"></section>
  </main>
  <script type="module" src="view.js"></script>
</body>
</html>
