id = "azure-boards"
name = "Azure Boards"
version = "1.8.6"
api = 1
description = "Your Azure DevOps work items as a tree, with what's under and above them: their pages as in Azure DevOps, changes (state, assignee, comments…), notifications, the current sprint, the hours you logged by day"
homepage = "https://github.com/Nozeren/thumbdeck-plugins/tree/main/plugins/views/azure-boards"
icon = "icon.svg"

[view]
name = "Azure Boards"
page = "view.html"
status = true

[backend]
command = "node backend.js"
# It looks every few minutes, and tells you what changed on your work items
autostart = true

[[settings]]
key = "organization"
label = "Organization"
type = "text"
default = ""
help = "Its name (dev.azure.com/<name>) or URL. demo shows sample work items."

[[settings]]
key = "token"
label = "Personal access token"
type = "secret"
default = ""
help = "Azure DevOps › User settings › Personal access tokens › New token, with Work Items: Read & write (Read: to only look). Kept in thumbdeck's settings file, which only you can read."

[[settings]]
key = "show"
label = "Show"
type = "choice"
choices = [
  { value = "assigned", label = "Assigned to me" },
  { value = "created", label = "Created by me" },
  { value = "following", label = "Ones I follow" },
]
default = "assigned"

[[settings]]
key = "projects"
label = "Only these projects"
type = "list"
default = []
help = "Empty: every project"

[[settings]]
key = "hidden_states"
label = "Leave out these states"
type = "list"
default = ["Closed", "Done", "Removed"]

[[settings]]
key = "team"
label = "Team (for the current sprint)"
type = "text"
default = ""
help = "Empty: each project's default team"

[[settings]]
key = "notify_assigned"
label = "Tell me when a work item is assigned to me"
type = "bool"
default = true

[[settings]]
key = "notify_state"
label = "Tell me when one of mine changes state (not by me)"
type = "bool"
default = true

[[settings]]
key = "notify_comments"
label = "Tell me about new comments on mine (not mine)"
type = "bool"
default = true

[[settings]]
key = "fields"
label = "Fields"
type = "list"
default = []
help = "Your organization's own fields show by themselves. To change how one shows, or show one of Azure DevOps' own: reference name | label | format | where. Formats: text, markdown, html, date, number, person, yes-no, link. Where: main (beside the description), planning, details, hidden. E.g. Custom.Impact | Customer impact | markdown | main"

[[settings]]
key = "branch_prefix"
label = "Branch names start with"
type = "text"
default = "feature/"

[[settings]]
key = "hours_per_day"
label = "Hours in a working day"
type = "number"
min = 1
max = 24
default = 8
help = "The hours calendar (w) marks the days you logged this many hours, and the ones short of it."

[[settings]]
key = "hours_field"
label = "Hours field"
type = "text"
default = ""
help = "The field your hours are logged in. Empty: Completed Work (Microsoft.VSTS.Scheduling.CompletedWork). Your organization's own: its reference name, e.g. Custom.HoursSpent. A work log (a JSON list of entries) with its entries' date and amount keys: Custom.WorkLogData | date: startDate | amount: daysSpent; to log time from a work item's page (L) with the keys new entries get too: | end: endDate | id: _id | activity: activityType"

[[settings]]
key = "hours_unit"
label = "Hours field is in"
type = "choice"
choices = [
  { value = "hours", label = "Hours" },
  { value = "days", label = "Days (0.5: half a day)" },
]
default = "hours"
help = "Days: each one counts as a working day's hours (Hours in a working day)."

[[settings]]
key = "refresh_minutes"
label = "Look again every (minutes)"
type = "number"
min = 1
default = 5

[keys.view]
name = "AZURE BOARDS"
surface = "view"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "next work item" },
  { keys = ["k", "ArrowUp"], action = "up", does = "previous" },
  { keys = ["g"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["l", "ArrowRight", "Space"], action = "open", does = "show what's under it (then: into it)" },
  { keys = ["h", "ArrowLeft"], action = "close", does = "hide what's under it (or: up to its parent)" },
  { keys = ["d"], action = "page-down", does = "scroll its page down" },
  { keys = ["u"], action = "page-up", does = "scroll its page up" },
  { keys = ["o"], action = "outside", does = "open it in Azure DevOps" },
  { keys = ["y"], action = "copy-branch", does = "copy a branch name for it (feature/1234-its-title)" },
  { keys = ["Y"], action = "copy-ref", does = "copy 'TASK 1234 Its title' (for a commit or a message)" },
  { keys = ["/"], action = "filter", does = "filter by words in the title" },
  { keys = ["f"], action = "fold", does = "show all of its long texts / fold them again" },
  { keys = ["i"], action = "sprint", does = "only the current sprint's / every iteration's" },
  { keys = ["s"], action = "state", does = "change its state" },
  { keys = ["a"], action = "assign", does = "assign it (to you, someone, nobody)" },
  { keys = ["c"], action = "comment", does = "write a comment (the box under its activity; Ctrl+Enter sends)" },
  { keys = ["e"], action = "title", does = "edit its title" },
  { keys = ["t"], action = "tags", does = "edit its tags" },
  { keys = ["p"], action = "priority", does = "change its priority" },
  { keys = ["m"], action = "iteration", does = "move it to another iteration (sprint)" },
  { keys = ["r"], action = "refresh", does = "look again now" },
  { keys = ["w"], action = "hours", does = "the hours you logged, day by day (a calendar) / back to the list" },
  { keys = ["F"], action = "search", does = "search work items: a number, or words in their title (anyone's, any state)" },
  { keys = ["L"], action = "log", does = "log time on it (the Hours field a work log), or change or remove an entry" },
]

# A work item's page on its own: one opened from the calendar, a search, Related work or a #123 link
[keys.page]
name = "WORK ITEM"
surface = "view"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "scroll down" },
  { keys = ["k", "ArrowUp"], action = "up", does = "scroll up" },
  { keys = ["g"], action = "first", does = "to the top" },
  { keys = ["G"], action = "last", does = "to the end" },
  { keys = ["d"], action = "page-down", does = "scroll a page down" },
  { keys = ["u"], action = "page-up", does = "scroll a page up" },
  { keys = ["o"], action = "outside", does = "open it in Azure DevOps" },
  { keys = ["y"], action = "copy-branch", does = "copy a branch name for it" },
  { keys = ["Y"], action = "copy-ref", does = "copy 'TASK 1234 Its title'" },
  { keys = ["f"], action = "fold", does = "show all of its long texts / fold them again" },
  { keys = ["s"], action = "state", does = "change its state" },
  { keys = ["a"], action = "assign", does = "assign it" },
  { keys = ["c"], action = "comment", does = "write a comment" },
  { keys = ["e"], action = "title", does = "edit its title" },
  { keys = ["t"], action = "tags", does = "edit its tags" },
  { keys = ["p"], action = "priority", does = "change its priority" },
  { keys = ["m"], action = "iteration", does = "move it to another iteration" },
  { keys = ["L"], action = "log", does = "log time on it, or change or remove an entry" },
  { keys = ["F"], action = "search", does = "search work items" },
  { keys = ["w"], action = "hours", does = "the hours calendar" },
  { keys = ["r"], action = "refresh", does = "look again" },
  { keys = ["q", "Escape"], action = "leave", does = "back where you came from (the calendar, the search, the list)" },
]

# A search's results
[keys.search]
name = "SEARCH"
surface = "view"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "next" },
  { keys = ["k", "ArrowUp"], action = "up", does = "previous" },
  { keys = ["g"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["l", "Enter", "Space"], action = "open", does = "its page" },
  { keys = ["o"], action = "outside", does = "open it in Azure DevOps" },
  { keys = ["F"], action = "search", does = "search again" },
  { keys = ["w"], action = "hours", does = "the hours calendar" },
  { keys = ["r"], action = "refresh", does = "search again with the same words" },
  { keys = ["q", "Escape"], action = "leave", does = "back where you came from" },
]
