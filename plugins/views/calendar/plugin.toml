id = "calendar"
name = "Calendar"
version = "1.1.0"
api = 1
description = "Your calendars' coming events, what's next, and reminders (from iCal links, read-only)"
homepage = "https://github.com/Nozeren/thumbdeck-plugins/tree/main/plugins/views/calendar"

[view]
name = "Calendar"
page = "view.html"
status = true

[backend]
command = "node backend.js"
# Reminders and "what's next" work without the view open
autostart = true

[[settings]]
key = "calendars"
label = "iCal links"
type = "list"
default = []
help = "A calendar's private iCal address (Google: Settings › the calendar › Secret address in iCal format; Outlook: Publish a calendar › ICS). webcal:// works too."

[[settings]]
key = "remind_minutes"
label = "Remind me this many minutes before"
type = "number"
min = 0
default = 5

[[settings]]
key = "days"
label = "Days ahead to show"
type = "number"
min = 1
max = 60
default = 7

[[settings]]
key = "refresh_minutes"
label = "Read the calendars again every (minutes)"
type = "number"
min = 1
default = 15

[[settings]]
key = "week_starts"
label = "Weeks start on"
type = "choice"
choices = [{ value = "monday", label = "Monday" }, { value = "sunday", label = "Sunday" }]
default = "monday"

[keys.view]
name = "CALENDAR"
surface = "view"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "next event (a week later, in the month)" },
  { keys = ["k", "ArrowUp"], action = "up", does = "previous event (a week earlier)" },
  { keys = ["g"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["m"], action = "month", does = "the month, or back to the coming days" },
  { keys = ["t"], action = "now", does = "back to what's next (today, in the month)" },
  { keys = ["h", "ArrowLeft"], action = "left", does = "the day before (in the month)" },
  { keys = ["ArrowRight"], action = "right", does = "the day after (in the month)" },
  { keys = ["d", "]"], action = "page-down", does = "next month (10 events down in the coming days)" },
  { keys = ["u", "["], action = "page-up", does = "previous month (10 events up)" },
  { keys = ["o"], action = "outside", does = "open the meeting link (or the event's link) in the browser" },
  { keys = ["r"], action = "refresh", does = "read the calendars again" },
]
