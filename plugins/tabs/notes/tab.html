<html>

    body { display: flex; flex-direction: column; overflow: hidden; }
    #text { flex: 1; margin: 10px 12px; resize: none; font: 13px/1.6 var(--mono); padding: 10px 12px; }

<body>
  <header class="td-toolbar"><strong>Notes</strong> <span class="td-muted" id="saved"></span>

</html>
