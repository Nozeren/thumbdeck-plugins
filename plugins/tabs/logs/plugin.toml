id = "logs"
name = "Logs"
version = "2.0.0"
api = 2
description = "The project's log files: levels, search, errors, live tail, optional sections"
homepage = "https://github.com/Nozeren/thumbdeck-plugins/tree/main/plugins/tabs/logs"
icon = "icon.svg"

[backend]
command = "node backend.js"

[[tab]]
id = "logs"
name = "Logs"
page = "dist/tab.html"
# Sections are more than a form of fields: the tab has its own setup page
setup_page = "dist/setup.html"

[[tab.setup]]
key = "folders"
label = "Folders"
type = "folders"
default = [".", "logs", "log"]

[[tab.setup]]
key = "pattern"
label = "Log files"
type = "text"
default = "*.log"

[[tab.setup]]
key = "blocks"
label = "Sections"
type = "json"
default = []

[[tab.setup]]
key = "fields"
label = "JSON field names"
type = "json"
default = { message = ["message", "msg", "event", "text", "log"], level = ["level", "levelname", "severity", "lvl", "loglevel"], time = ["timestamp", "time", "ts", "@timestamp", "asctime", "datetime", "date"] }

[[tab.setup]]
key = "line_pattern"
label = "Plain-text line pattern"
type = "text"
default = ""

[keys.files]
name = "LOGS"
surface = "tab:logs"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "down" },
  { keys = ["k", "ArrowUp"], action = "up", does = "up" },
  { keys = ["gg"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["l", "Enter"], action = "open", does = "open the log" },
  { keys = ["R"], action = "refresh", does = "look for logs again" },
]

[keys.log]
name = "LOG"
surface = "tab:logs"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "down" },
  { keys = ["k", "ArrowUp"], action = "up", does = "up" },
  { keys = ["gg"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["l", "Enter", "ArrowRight"], action = "open", does = "open a section / a line's full entry" },
  { keys = ["h", "ArrowLeft"], action = "close", does = "close a section (on a line: its section)" },
  { keys = ["za"], action = "fold-toggle", does = "open / close the section" },
  { keys = ["zo"], action = "fold-open", does = "open the section" },
  { keys = ["zc"], action = "fold-close", does = "close the section" },
  { keys = ["zR"], action = "unfold-all", does = "open every section" },
  { keys = ["zM"], action = "fold-all", does = "close every section" },
  { keys = ["Ctrl+d"], action = "page-down", does = "half a page down" },
  { keys = ["Ctrl+u"], action = "page-up", does = "half a page up" },
  { keys = ["Ctrl+f", "PageDown"], action = "full-down", does = "a page down" },
  { keys = ["Ctrl+b", "PageUp"], action = "full-up", does = "a page up" },
  { keys = ["]e"], action = "next-error", does = "the next ERROR" },
  { keys = ["[e"], action = "previous-error", does = "the previous ERROR" },
  { keys = ["/"], action = "search", does = "search" },
  { keys = ["n"], action = "next-match", does = "the next match" },
  { keys = ["N"], action = "previous-match", does = "the previous match" },
  { keys = ["Space w"], action = "watch", does = "live tail on / off" },
  { keys = ["Space c"], action = "fold", does = "fold repeated lines (×n) / show every line" },
  { keys = ["Space ="], action = "request", does = "only this line's request (req, request_id, trace_id…) / every line" },
  { keys = ["Space i"], action = "info", does = "the entry beside the log: hide / show" },
  { keys = ["Space f"], action = "filter", does = "show / hide levels: then D I W E, or A for all" },
  { keys = ["v"], action = "visual", does = "select lines (j / k extend), then y copies them" },
  { keys = ["V"], action = "visual-line", does = "the same" },
  { keys = ["yy", "Y"], action = "yank", does = "copy the message (a section: its title); in a selection, y copies the lines" },
  { keys = ["Space y j"], action = "copy-json", does = "copy as JSON (the line, or the selected lines)" },
  { keys = ["R"], action = "refresh", does = "read the log again" },
  { keys = ["Backspace", "-"], action = "back", does = "back to the files" },
  { keys = ["q", "Escape"], action = "leave", does = "close the search status, else give the keyboard back" },
]

[keys.visual]
name = "VISUAL"
surface = "tab:logs"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "extend down" },
  { keys = ["k", "ArrowUp"], action = "up", does = "extend up" },
  { keys = ["gg"], action = "first", does = "to the first line" },
  { keys = ["G"], action = "last", does = "to the last line" },
  { keys = ["Ctrl+d"], action = "page-down", does = "half a page down" },
  { keys = ["Ctrl+u"], action = "page-up", does = "half a page up" },
  { keys = ["y"], action = "yank-selection", does = "copy the selected lines" },
  { keys = ["Y"], action = "yank", does = "the same" },
  { keys = ["Space y j"], action = "copy-json", does = "copy them as JSON" },
  { keys = ["v"], action = "visual", does = "drop the selection" },
  { keys = ["V"], action = "visual-line", does = "drop the selection" },
  { keys = ["q", "Escape"], action = "leave", does = "drop the selection" },
]

[keys.levels]
name = "LEVELS"
surface = "tab:logs"
bindings = [
  { keys = ["D"], action = "DEBUG", does = "show / hide DEBUG" },
  { keys = ["I"], action = "INFO", does = "show / hide INFO" },
  { keys = ["W"], action = "WARNING", does = "show / hide WARNING" },
  { keys = ["E"], action = "ERROR", does = "show / hide ERROR" },
  { keys = ["A"], action = "all", does = "show all" },
  { keys = ["Escape"], action = "leave", does = "never mind" },
]

[keys.entry]
name = "ENTRY"
surface = "tab:logs"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "down" },
  { keys = ["k", "ArrowUp"], action = "up", does = "up" },
  { keys = ["gg"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["l", "Enter"], action = "open", does = "open / close a value" },
  { keys = ["h"], action = "close", does = "close (on a value: its parent)" },
  { keys = ["yy", "Y"], action = "yank", does = "copy the value" },
  { keys = ["Space y j"], action = "copy-json", does = "copy the whole entry as JSON" },
  { keys = ["q", "Escape", "Backspace"], action = "leave", does = "close the entry" },
]
