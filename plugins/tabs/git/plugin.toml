id = "git"
name = "Git"
version = "2.1.0"
api = 2
description = "The repo at a glance: changes and their diffs, the branch, commits, branches and stashes (read-only)"
homepage = "https://github.com/Nozeren/thumbdeck-plugins/tree/main/plugins/tabs/git"
icon = "icon.svg"

# Only for git repositories
[detect]
files = [".git"]

[[tab]]
id = "git"
name = "Git"
page = "tab.html"

[[tab.setup]]
key = "commits"
label = "Recent commits to list"
type = "number"
min = 1
default = 100

# Cards in the project's Overview
[[card]]
id = "changes"
name = "Changes"
page = "card.html"

[[card]]
id = "commits"
name = "Recent commits"
page = "card.html"
opens = "git"

[keys.changes]
name = "CHANGES"
surface = "card:changes"
bindings = [
  { keys = ["Enter"], action = "review", does = "review the uncommitted changes" },
  { keys = ["gd"], action = "diff", does = "the same" },
  { keys = ["R"], action = "refresh", does = "look again" },
]

[keys.commits]
name = "COMMITS"
surface = "card:commits"
bindings = [
  { keys = ["R"], action = "refresh", does = "look again" },
]

[keys.git]
name = "GIT"
surface = "tab:git"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "down" },
  { keys = ["k", "ArrowUp"], action = "up", does = "up" },
  { keys = ["gg"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["l"], action = "open", does = "review: all changes (at this file), the commit, the stash" },
  { keys = ["Enter"], action = "review", does = "the same" },
  { keys = ["gd"], action = "diff", does = "the same" },
  { keys = ["v"], action = "visual", does = "in Commits: pick commits to see together (j / k pick more)" },
  { keys = ["V"], action = "visual-line", does = "the same" },
  { keys = ["Tab"], action = "next-list", does = "next list: changes → commits → branches" },
  { keys = ["Shift+Tab"], action = "previous-list", does = "previous list" },
  { keys = ["Ctrl+d", "PageDown"], action = "page-down", does = "scroll the diff down" },
  { keys = ["Ctrl+u", "PageUp"], action = "page-up", does = "scroll the diff up" },
  { keys = ["R"], action = "refresh", does = "refresh" },
]

# While picking commits (v in Commits)
[keys.visual]
name = "VISUAL"
surface = "tab:git"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "pick one more below" },
  { keys = ["k", "ArrowUp"], action = "up", does = "pick one more above" },
  { keys = ["gg"], action = "first", does = "pick up to the first" },
  { keys = ["G"], action = "last", does = "pick down to the last" },
  { keys = ["Enter"], action = "review", does = "review the picked commits together" },
  { keys = ["l"], action = "open", does = "the same" },
  { keys = ["gd"], action = "diff", does = "the same" },
  { keys = ["Ctrl+d", "PageDown"], action = "page-down", does = "scroll the diff down" },
  { keys = ["Ctrl+u", "PageUp"], action = "page-up", does = "scroll the diff up" },
  { keys = ["Tab"], action = "next-list", does = "stop picking: the next list" },
  { keys = ["Shift+Tab"], action = "previous-list", does = "stop picking: the previous list" },
  { keys = ["R"], action = "refresh", does = "refresh" },
  { keys = ["v"], action = "visual", does = "stop picking" },
  { keys = ["V"], action = "visual-line", does = "stop picking" },
  { keys = ["q", "Escape"], action = "leave", does = "stop picking" },
]
