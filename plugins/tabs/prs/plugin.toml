id = "prs"
name = "Pull requests"
version = "3.0.0"
api = 2
description = "The open PRs that concern you in every repo you're in: to review again, to review, reviewed, yours; reviewed with comments, suggestions and a verdict"
homepage = "https://github.com/Nozeren/thumbdeck-plugins/tree/main/plugins/tabs/prs"
icon = "icon.svg"

[view]
name = "Pull requests"
page = "view.html"
status = true

[[settings]]
key = "repos"
label = "Repos"
type = "text"
default = ""
help = "Empty: every repo you're in. Or owners (acme) and repos (acme/app), separated by spaces. demo: sample PRs."

[[settings]]
key = "stale_days"
label = "Stale after (days, 0: never)"
type = "number"
min = 0
default = 7

[[settings]]
key = "refresh_minutes"
label = "Refresh every (minutes)"
type = "number"
min = 1
default = 5

[[settings]]
key = "bots"
label = "Reviewers to leave out (bots)"
type = "list"
default = ["copilot-pull-request-reviewer"]

[[settings]]
key = "trim_suffix"
label = "Cut from the end of user names"
type = "text"
default = ""
help = "e.g. _company: ann_company shows as ann"

[keys.view]
name = "PULL REQUESTS"
surface = "view"
bindings = [
  { keys = ["j", "ArrowDown"], action = "down", does = "down" },
  { keys = ["k", "ArrowUp"], action = "up", does = "up" },
  { keys = ["gg"], action = "first", does = "first" },
  { keys = ["G"], action = "last", does = "last" },
  { keys = ["Enter"], action = "review", does = "review it: comment, suggest, approve or request changes" },
  { keys = ["l"], action = "open", does = "the same" },
  { keys = ["gd"], action = "diff", does = "the same" },
  { keys = ["yy", "Y"], action = "yank", does = "copy its link" },
  { keys = ["gx"], action = "outside", does = "open in the browser (marks its 🔔 read)" },
  { keys = ["Space f"], action = "filter", does = "the next filter: all, to review, yours, unread" },
  { keys = ["Ctrl+d", "PageDown"], action = "page-down", does = "scroll the details down" },
  { keys = ["Ctrl+u", "PageUp"], action = "page-up", does = "scroll the details up" },
  { keys = ["R"], action = "refresh", does = "refresh now" },
]
